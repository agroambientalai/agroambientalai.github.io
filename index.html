<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroAmbientalAI</title>
<style>
  :root {
    --bg: #0f1410;
    --panel: #161d17;
    --border: #2a332b;
    --text: #e8ece8;
    --muted: #9fb0a0;
    --accent: #5fbf77;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 20px;
  }
  h1 { font-size: 1.8rem; margin-bottom: 8px; }
  p.tagline { color: var(--muted); margin-top: 0; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-top: 24px;
  }
  a { color: var(--accent); }
  ul { padding-left: 20px; }
  footer { color: var(--muted); font-size: 0.85rem; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <h1>AgroAmbientalAI</h1>
  <p class="tagline">Inteligência Artificial a serviço do equilíbrio entre produção agrícola e preservação ambiental.</p>

  <div class="card">
    <strong>Documentos públicos</strong>
    <ul>
      <li><a href="/privacy/">Política de Privacidade (Português)</a></li>
      <li><a href="/privacy/en/">Privacy Policy (English)</a></li>
    </ul>
  </div>

  <footer>
    AgroAmbientalAI &middot; Campo Grande - MS, Brasil &middot;
    <a href="mailto:wmtechti@gmail.com">wmtechti@gmail.com</a>
  </footer>
</main>
</body>
</html>
